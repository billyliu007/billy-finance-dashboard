services:
  - type: web
    name: billy-finance-backend
    env: node
    rootDir: .
    buildCommand: npm ci --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_RANGE
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY
        sync: false
      - key: FINNHUB_API_KEY
        value: CHANGE_ME_FINNHUB_API_KEY
      - key: FX_PROVIDER
        value: frankfurter
      - key: CRYPTO_PROVIDER
        value: coinbase

  - type: web
    name: billy-finance-frontend
    env: static
    rootDir: .
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

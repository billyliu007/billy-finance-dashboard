# My Worth Track – Render Blueprint
#
# Backend and local dev use the same database (schema and data already in place).
# Migrations are manual: run `npm run db:migrate` from repo root (with DATABASE_URL set)
# when you add or change migrations; no pre-deploy migration step.
#
# Postgres / Neon: use a pooled connection string when available; optional PGPOOL_MAX in
# the env group caps concurrent clients (see docs/ARCHITECTURE.md). Repositories use
# withTransaction() / query() from backend/src/db/client.js for DRY connection handling.
#
# Where each variable lives (each secret is declared in exactly ONE place):
#   - envVarGroups.netpulse-secrets: secrets shared by the backend and the daily cron.
#   - service envVars: secrets only that service needs, plus non-secret fixed values.
# `sync: false` means "secret, never stored in this file": Render asks for the value
# when the Blueprint is first created; afterwards edit it in the Render dashboard.
# `generateValue: true` makes Render create a random value once, at creation.

envVarGroups:
  - name: netpulse-secrets
    envVars:
      # Database (same DB as localhost). Prefer `sslmode=verify-full` in the URL.
      - key: DATABASE_URL
        sync: false
      # Market data (stock quotes) – used by the API and the daily snapshot.
      - key: FINNHUB_API_KEY
        sync: false
      # Public URL of the SPA, e.g. https://www.myworthtrack.com (CORS cookies + redirects).
      - key: FRONTEND_BASE_URL
        sync: false
      # OAuth – Google
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CALLBACK_URL
        sync: false

services:
  # Backend API (Node)
  - type: web
    name: netpulse-backend
    env: node
    rootDir: .
    buildCommand: npm ci --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - fromGroup: netpulse-secrets

      # Database tuning (DATABASE_URL comes from the group)
      - key: DATABASE_SSL
        value: "true"
      # Optional: cap pg pool size per instance (Neon / small max_connections)
      # - key: PGPOOL_MAX
      #   value: "5"
      # Postgres resiliency for transient connection issues (cron + managed DBs)
      - key: PG_RETRY_ATTEMPTS
        value: "3"
      - key: PG_RETRY_BASE_DELAY_MS
        value: "750"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: PG_IDLE_TIMEOUT_MS
        value: "30000"

      # App & auth (FRONTEND_BASE_URL comes from the group)
      - key: TRUST_PROXY
        value: "true"
      - key: AUTH_SESSION_TTL_MS
        value: "1209600000"
      # Token for POST /api/internal/snapshot/daily; random value generated at creation.
      - key: SNAPSHOT_CRON_TOKEN
        generateValue: true

      # OAuth – Microsoft (personal accounts); see docs/MICROSOFT_LOGIN.md
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      # Not a secret, so the Blueprint sets it; must match the Entra app's redirect URI.
      - key: MICROSOFT_OAUTH_CALLBACK_URL
        value: https://api.myworthtrack.com/api/auth/microsoft/callback

      # Passkeys: bound to the parent domain so they work for app.myworthtrack.com (the origin
      # defaults to FRONTEND_BASE_URL). Never change this later: existing passkeys would stop working.
      - key: WEBAUTHN_RP_ID
        value: myworthtrack.com

      # OAuth – Apple (optional; button hidden while APPLE_CLIENT_ID is empty)
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CALLBACK_URL
        sync: false

      # Market data providers (FINNHUB_API_KEY comes from the group)
      - key: FX_PROVIDER
        value: frankfurter
      - key: CRYPTO_PROVIDER
        value: coinbase

  # Backend API (Node) – Singapore copy, next to the Neon database (ap-southeast-1) and
  # outside the US, so Binance's API is reachable. Runs alongside the Oregon service until
  # api.myworthtrack.com is switched over; then the Oregon service is deleted.
  - type: web
    name: netpulse-backend-sg
    region: singapore
    plan: free
    env: node
    rootDir: .
    buildCommand: npm ci --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - fromGroup: netpulse-secrets

      # Database tuning (DATABASE_URL comes from the group)
      - key: DATABASE_SSL
        value: "true"
      # Optional: cap pg pool size per instance (Neon / small max_connections)
      # - key: PGPOOL_MAX
      #   value: "5"
      # Postgres resiliency for transient connection issues (cron + managed DBs)
      - key: PG_RETRY_ATTEMPTS
        value: "3"
      - key: PG_RETRY_BASE_DELAY_MS
        value: "750"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: PG_IDLE_TIMEOUT_MS
        value: "30000"

      # App & auth (FRONTEND_BASE_URL comes from the group)
      # Hashes API tokens. Must be the SAME value as on the Oregon service, or every
      # existing API token (incl. the MCP server's) stops working.
      - key: API_TOKEN_PEPPER
        sync: false
      - key: TRUST_PROXY
        value: "true"
      - key: AUTH_SESSION_TTL_MS
        value: "1209600000"
      # Token for POST /api/internal/snapshot/daily; random value generated at creation.
      - key: SNAPSHOT_CRON_TOKEN
        generateValue: true

      # OAuth – Microsoft (personal accounts); see docs/MICROSOFT_LOGIN.md
      - key: MICROSOFT_OAUTH_CLIENT_ID
        sync: false
      - key: MICROSOFT_OAUTH_CLIENT_SECRET
        sync: false
      # Not a secret, so the Blueprint sets it; must match the Entra app's redirect URI.
      - key: MICROSOFT_OAUTH_CALLBACK_URL
        value: https://api.myworthtrack.com/api/auth/microsoft/callback

      # Passkeys: bound to the parent domain so they work for app.myworthtrack.com (the origin
      # defaults to FRONTEND_BASE_URL). Never change this later: existing passkeys would stop working.
      - key: WEBAUTHN_RP_ID
        value: myworthtrack.com

      # OAuth – Apple (optional; button hidden while APPLE_CLIENT_ID is empty)
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CALLBACK_URL
        sync: false

      # Market data providers (FINNHUB_API_KEY comes from the group)
      - key: FX_PROVIDER
        value: frankfurter
      - key: CRYPTO_PROVIDER
        value: coinbase

  # Frontend (static SPA)
  - type: web
    name: netpulse-frontend
    env: static
    rootDir: .
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.myworthtrack.com
      - key: VITE_SHOW_DEVELOPMENT_PAGE
        value: "false"

  # Daily net worth snapshot (uses same DB; no OAuth)
  - type: cron
    name: netpulse-daily-snapshot
    env: node
    rootDir: .
    schedule: "0 0 * * *"
    buildCommand: npm ci --prefix backend
    startCommand: npm run cron:daily-snapshot --prefix backend
    envVars:
      # DATABASE_URL and FINNHUB_API_KEY come from the group
      - fromGroup: netpulse-secrets
      - key: DATABASE_SSL
        value: "true"
      # Optional: cap pg pool size per instance (Neon / small max_connections)
      # - key: PGPOOL_MAX
      #   value: "5"
      # Postgres resiliency for transient connection issues (cron + managed DBs)
      - key: PG_RETRY_ATTEMPTS
        value: "3"
      - key: PG_RETRY_BASE_DELAY_MS
        value: "750"
      - key: PG_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: PG_IDLE_TIMEOUT_MS
        value: "30000"
      - key: FX_PROVIDER
        value: frankfurter
      - key: CRYPTO_PROVIDER
        value: coinbase

services:
  - type: web
    name: netpulse-backend
    env: node
    rootDir: .
    buildCommand: npm ci --prefix backend
    preDeployCommand: npm run db:migrate --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    envVars:
      # Secrets are sourced from this Render Environment Group.
      - fromGroup: netpulse-secrets
      # Required secret/env keys (documented explicitly for portability).
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false
      # Example: https://your-frontend-domain.onrender.com
      - key: AUTH_SESSION_TTL_MS
        value: "1209600000"
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CALLBACK_URL
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CALLBACK_URL
        sync: false
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: WECHAT_CALLBACK_URL
        sync: false
      - key: SNAPSHOT_CRON_TOKEN
        sync: false
      - key: MIGRATION_BIND_ENABLED
        value: "true"
      - key: DATABASE_SSL
        value: "true"
      - key: DATA_SOURCE
        value: db
      - key: FINNHUB_API_KEY
        sync: false
      - key: FX_PROVIDER
        value: frankfurter
      - key: CRYPTO_PROVIDER
        value: coinbase

  - type: web
    name: netpulse-frontend
    env: static
    rootDir: .
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://netpulse-backend-qrqx.onrender.com
      - key: VITE_SHOW_DEVELOPMENT_PAGE
        value: "false"

  - type: cron
    name: netpulse-daily-snapshot
    env: node
    rootDir: .
    schedule: "0 0 * * *"
    buildCommand: npm ci --prefix backend
    startCommand: npm run cron:daily-snapshot --prefix backend
    envVars:
      - fromGroup: netpulse-secrets
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATA_SOURCE
        value: db
      - key: FINNHUB_API_KEY
        sync: false
      - key: FX_PROVIDER
        value: frankfurter
      - key: CRYPTO_PROVIDER
        value: coinbase

# My Worth Track – Render Blueprint
#
# Backend and local dev use the same database (schema and data already in place).
# No migrations run on deploy; run them manually when the schema changes.

services:
  # Backend API (Node)
  - type: web
    name: netpulse-backend
    env: node
    rootDir: .
    buildCommand: npm ci --prefix backend
    startCommand: npm run start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - fromGroup: netpulse-secrets

      # Database (same DB as localhost; set in group or here)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"

      # App & auth
      - key: FRONTEND_BASE_URL
        sync: false
      - key: AUTH_SESSION_TTL_MS
        value: "1209600000"
      - key: SNAPSHOT_CRON_TOKEN
        sync: false

      # OAuth – Google
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CALLBACK_URL
        sync: false

      # OAuth – Apple
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CALLBACK_URL
        sync: false

      # OAuth – WeChat
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: WECHAT_CALLBACK_URL
        sync: false

      # Market data
      - key: FINNHUB_API_KEY
        sync: false
      - key: FX_PROVIDER
        value: frankfurter
      - key: CRYPTO_PROVIDER
        value: coinbase

  # Frontend (static SPA)
  - type: web
    name: netpulse-frontend
    env: static
    rootDir: .
    buildCommand: npm install --prefix frontend && npm run build --prefix frontend
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.myworthtrack.com
      - key: VITE_SHOW_DEVELOPMENT_PAGE
        value: "false"

  # Daily net worth snapshot (uses same DB; no OAuth)
  - type: cron
    name: netpulse-daily-snapshot
    env: node
    rootDir: .
    schedule: "0 0 * * *"
    buildCommand: npm ci --prefix backend
    startCommand: npm run cron:daily-snapshot --prefix backend
    envVars:
      - fromGroup: netpulse-secrets
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: FINNHUB_API_KEY
        sync: false
      - key: FX_PROVIDER
        value: frankfurter
      - key: CRYPTO_PROVIDER
        value: coinbase
